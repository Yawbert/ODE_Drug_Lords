<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Spill Interactive Dashboard</title>
    <!-- Import Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --abyss: #050D1A; --deep: #0A1628; --navy: #0D2240; --faint: #2A3F5A;
            --cyan: #00D4B8; --muted: #7A9BBF; --white: #E8F4FF;
            --font-body: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
        body { background: var(--abyss); color: var(--white); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Control Bar */
        .top-controls { background: var(--deep); border-bottom: 1px solid var(--faint); padding: 1.5rem; display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; align-items: flex-end; }
        
        .control-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 160px; max-width: 250px; }
        .control-group label { font-size: 0.85rem; color: var(--cyan); font-weight: 500; display: flex; justify-content: space-between; }
        .control-group input[type="range"] { width: 100%; accent-color: var(--cyan); cursor: pointer; }
        
        .btn-reset { background: var(--faint); color: var(--white); border: 1px solid var(--muted); padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; height: fit-content; }
        .btn-reset:hover { background: var(--muted); color: var(--abyss); }

        /* Main Subplot Grid */
        .main-content { flex: 1; padding: 1.5rem; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 1.5rem; }
        
        .chart-container { background: var(--navy); border: 1px solid var(--faint); border-radius: 8px; padding: 1rem; position: relative; min-height: 250px; }
        .chart-title { position: absolute; top: 10px; left: 15px; font-size: 0.85rem; color: var(--muted); font-weight: bold; z-index: 10; }
        canvas { width: 100% !important; height: 100% !important; padding-top: 20px; }

        /* Responsive Breakpoints */
        @media(max-width: 1100px){
            .main-content { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
        }
        @media(max-width: 768px){
            .main-content { grid-template-columns: 1fr; display: flex; flex-direction: column; }
            .chart-container { height: 300px; }
            .top-controls { flex-direction: column; align-items: stretch; }
            .control-group { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TOP CONTROL BAR -->
    <div class="top-controls">
        <div class="control-group">
            <label><span>Wind Speed (W)</span> <span id="val-W">5.0 m/s</span></label>
            <input type="range" id="slider-W" min="0.1" max="20" step="0.1" value="5.0">
        </div>
        <div class="control-group">
            <label><span>Temperature (T)</span> <span id="val-T">283.1 K</span></label>
            <input type="range" id="slider-T" min="273.1" max="313.1" step="0.1" value="283.1">
        </div>
        <div class="control-group">
            <label><span>Initial Vol (V₀)</span> <span id="val-V0">10000 m³</span></label>
            <input type="range" id="slider-V0" min="1000" max="25000" step="100" value="10000">
        </div>
        <div class="control-group">
            <label><span>Initial Area (A₀)</span> <span id="val-A0">1000 m²</span></label>
            <input type="range" id="slider-A0" min="100" max="10000" step="100" value="1000">
        </div>
        <div class="control-group">
            <label><span>Viscosity (μ₀)</span> <span id="val-mu0">0.010 Pa.s</span></label>
            <input type="range" id="slider-mu0" min="0.001" max="0.1" step="0.001" value="0.01">
        </div>
        <div class="control-group">
            <label><span>Time</span> <span id="val-tFinal">200 hrs</span></label>
            <input type="range" id="slider-tFinal" min="10" max="300" step="5" value="200">
        </div>
        <button class="btn-reset" onclick="resetParams()">Reset</button>
    </div>

    <!-- MAIN CHART AREA -->
    <div class="main-content">
        <div class="chart-container"><div class="chart-title">Evaporation Fraction (F_E)</div><canvas id="chartFE"></canvas></div>
        <div class="chart-container"><div class="chart-title">Oil Volume (m³)</div><canvas id="chartV"></canvas></div>
        <div class="chart-container"><div class="chart-title">Water Content (Y)</div><canvas id="chartY"></canvas></div>
        <div class="chart-container"><div class="chart-title">Spill Area (m²)</div><canvas id="chartA"></canvas></div>
        <div class="chart-container"><div class="chart-title">Viscosity (Pa.s)</div><canvas id="chartMu"></canvas></div>
        <div class="chart-container"><div class="chart-title">Normalised Comparison</div><canvas id="chartCombined"></canvas></div>
    </div>

    <script>
        const sliders = { W: document.getElementById('slider-W'), T: document.getElementById('slider-T'), V0: document.getElementById('slider-V0'), A0: document.getElementById('slider-A0'), mu0: document.getElementById('slider-mu0'), tFinal: document.getElementById('slider-tFinal') };
        const labels = { W: document.getElementById('val-W'), T: document.getElementById('val-T'), V0: document.getElementById('val-V0'), A0: document.getElementById('val-A0'), mu0: document.getElementById('val-mu0'), tFinal: document.getElementById('val-tFinal') };
        const defaults = { W: 5.0, T: 283.1, V0: 10000, A0: 1000, mu0: 0.01, tFinal: 200 };
        const Apar = 2.898, B = 10.3, T0 = 294, TG = 636, C3 = 0.7, C4 = 0.5, K1 = 150;

        function runSimulation() {
            let P = { W: parseFloat(sliders.W.value), T: parseFloat(sliders.T.value), V0: parseFloat(sliders.V0.value), A0: parseFloat(sliders.A0.value), mu0: parseFloat(sliders.mu0.value), tFinal: parseFloat(sliders.tFinal.value) };
            let steps = 600; let dt = P.tFinal / steps;
            let time = [], FE = [], V = [], Y = [], A = [], mu = [];
            let state = [0, P.V0, 0, P.A0, P.mu0];

            function getDerivatives(st) {
                let fe = Math.max(st[0], 0), v = Math.max(st[1], 0), y = Math.max(st[2], 0), a = Math.max(st[3], 1e-4), m = Math.max(st[4], 1e-8);
                let K2 = 2.5e-3 * Math.pow(P.W * 3.6, 0.78);
                let K = K2 / (P.V0 / Math.max(a, 1e-4));
                let D = 0.11 * Math.pow(P.W + 1, 2) * Math.pow(1 + 50 * Math.sqrt(m) * (v / Math.max(a, 1e-4)) * 20, -1);
                let dFE = (K * a / Apar) * Math.exp(Apar - (B / P.T) * (T0 + TG * fe));
                let dV = -P.V0 * dFE - D * v;
                if (v <= 0 && dV < 0) dV = 0;
                let dY = 2e-6 * 3600 * Math.pow(P.W + 1, 2) * (1 - y / C3);
                let dA = K1 * Math.pow(a, -1) * Math.pow(v, 4/3);
                let denom = Math.max(Math.pow(1 - C3 * y, 2), 1e-8);
                let dmu = C4 * m * dFE + (2.5 * m / denom) * dY;
                return [dFE, dV, dY, dA, dmu];
            }

            for (let i = 0; i <= steps; i++) {
                time.push(Number((i * dt).toFixed(1))); // Prevents ugly trailing decimals on the X-axis
                FE.push(state[0]); V.push(state[1]); Y.push(state[2]); A.push(state[3]); mu.push(state[4]);
                let k1 = getDerivatives(state);
                let k2 = getDerivatives(state.map((s, j) => s + 0.5 * dt * k1[j]));
                let k3 = getDerivatives(state.map((s, j) => s + 0.5 * dt * k2[j]));
                let k4 = getDerivatives(state.map((s, j) => s + dt * k3[j]));
                state = state.map((s, j) => s + (dt / 6) * (k1[j] + 2*k2[j] + 2*k3[j] + k4[j]));
            }
            return { time, FE, V, Y, A, mu };
        }

        Chart.defaults.color = '#7A9BBF'; Chart.defaults.font.family = 'Inter';
        function createChart(ctxId, color) {
            return new Chart(document.getElementById(ctxId), {
                type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.1 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, animation: false, 
                    plugins: { 
                        legend: { display: false },
                        tooltip: { callbacks: { label: function(context) { return Number(context.parsed.y).toFixed(3); } } } 
                    }, 
                    scales: { 
                        x: { grid: { color: '#2A3F5A' }, ticks: { maxTicksLimit: 8 } }, 
                        y: { 
                            grid: { color: '#2A3F5A' },
                            ticks: { callback: function(value) { return Number.isInteger(value) ? value : Number(value.toFixed(3)); } }
                        } 
                    } 
                }
            });
        }

        const charts = {
            FE: createChart('chartFE', '#00D4B8'), V: createChart('chartV', '#D95319'), Y: createChart('chartY', '#EDB120'), A: createChart('chartA', '#FF6B35'), mu: createChart('chartMu', '#77AC30'),
            Combined: new Chart(document.getElementById('chartCombined'), {
                type: 'line',
                data: { labels: [], datasets: [ { label: 'Evap', data: [], borderColor: '#00D4B8', borderWidth: 2, pointRadius: 0 }, { label: 'Vol', data: [], borderColor: '#D95319', borderWidth: 2, pointRadius: 0 }, { label: 'Water', data: [], borderColor: '#EDB120', borderWidth: 2, pointRadius: 0 }, { label: 'Area', data: [], borderColor: '#FF6B35', borderWidth: 2, pointRadius: 0 }, { label: 'Visc', data: [], borderColor: '#77AC30', borderWidth: 2, pointRadius: 0 } ]},
                options: { 
                    responsive: true, maintainAspectRatio: false, animation: false, 
                    plugins: { 
                        legend: { display: true, labels: { boxWidth: 10, font: {size: 10} } },
                        tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + Number(context.parsed.y).toFixed(3); } } }
                    }, 
                    scales: { x: { grid: { color: '#2A3F5A' }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: '#2A3F5A' }, min: 0, max: 1 } } }
            })
        };

        function normalize(data) { let min = Math.min(...data), max = Math.max(...data), range = max - min; return range === 0 ? data.map(d => 0) : data.map(d => (d - min) / range); }

        function updateDashboard() {
            labels.W.innerText = parseFloat(sliders.W.value).toFixed(1) + ' m/s'; labels.T.innerText = parseFloat(sliders.T.value).toFixed(1) + ' K'; labels.V0.innerText = sliders.V0.value + ' m³'; labels.A0.innerText = sliders.A0.value + ' m²'; labels.mu0.innerText = parseFloat(sliders.mu0.value).toFixed(3) + ' Pa.s'; labels.tFinal.innerText = sliders.tFinal.value + ' hrs';
            const res = runSimulation();
            charts.FE.data.labels = res.time; charts.FE.data.datasets[0].data = res.FE; charts.FE.update();
            charts.V.data.labels = res.time; charts.V.data.datasets[0].data = res.V; charts.V.update();
            charts.Y.data.labels = res.time; charts.Y.data.datasets[0].data = res.Y; charts.Y.update();
            charts.A.data.labels = res.time; charts.A.data.datasets[0].data = res.A; charts.A.update();
            charts.mu.data.labels = res.time; charts.mu.data.datasets[0].data = res.mu; charts.mu.update();
            charts.Combined.data.labels = res.time; charts.Combined.data.datasets[0].data = normalize(res.FE); charts.Combined.data.datasets[1].data = normalize(res.V); charts.Combined.data.datasets[2].data = normalize(res.Y); charts.Combined.data.datasets[3].data = normalize(res.A); charts.Combined.data.datasets[4].data = normalize(res.mu); charts.Combined.update();
        }

        function resetParams() { sliders.W.value = defaults.W; sliders.T.value = defaults.T; sliders.V0.value = defaults.V0; sliders.A0.value = defaults.A0; sliders.mu0.value = defaults.mu0; sliders.tFinal.value = defaults.tFinal; updateDashboard(); }
        Object.values(sliders).forEach(slider => { slider.addEventListener('input', updateDashboard); });
        updateDashboard();
    </script>
</body>
</html>
